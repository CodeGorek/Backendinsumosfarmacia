<!--
    Plantilla del Formulario de Autenticación.
    Se comunica mediante peticiones asíncronas con el backend para solicitar el token JWT 
    y redirige al usuario a la vista correspondiente según sus permisos de rol.
-->
{% extends 'farmacia/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4 mt-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-circle-user display-4 text-primary mb-2"></i>
                    <h3 class="fw-bold">Iniciar Sesión</h3>
                    <p class="text-muted">Acceso seguro a la plataforma B2B</p>
                </div>
                
                <!-- Alerta de Error Oculta -->
                <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                    Credenciales incorrectas.
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre de Usuario</label>
                        <input type="text" id="username" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Contraseña</label>
                        <input type="password" id="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Redirección automática si ya está logueado
const existingToken = localStorage.getItem('access_token');
if (existingToken) {
    try {
        const base64Url = existingToken.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        
        const payload = JSON.parse(jsonPayload);
        if (payload.rol === 'INSTITUCION') {
            window.location.replace('/cliente/');
        } else {
            window.location.replace('/gestor/');
        }
    } catch(e) {
        console.error("Error leyendo token", e);
    }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verificando...';
    btn.disabled = true;

    try {
        const response = await fetch('/api/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });

        if (response.ok) {
            const data = await response.json();
            // 1. Guardar tokens en el navegador
            localStorage.setItem('access_token', data.access);
            
            // 2. Decodificar Payload JWT para leer el Rol asignado en Django
            const payload = JSON.parse(atob(data.access.split('.')[1]));
            
            // 3. Enrutamiento por Rol
            if (payload.rol === 'INSTITUCION') {
                window.location.href = '/cliente/';
            } else {
                window.location.href = '/gestor/'; // El Gestor usa el panel nativo
            }
        } else {
            document.getElementById('errorAlert').classList.remove('d-none');
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar';
            btn.disabled = false;
        }
    } catch (error) {
        console.error('Error de red', error);
    }
});
</script>
{% endblock %}
