<!--
    Plantilla del Panel de la Institución Médica (Cliente B2B).
    Renderiza el catálogo público, aplica los filtros a través de la API REST 
    y maneja la lógica local del carro de compras y ejecución de órdenes (Checkout).
-->
{% extends 'farmacia/base.html' %}

{% block content %}
<!-- Cabecera Hero -->
<div class="row align-items-center mb-5 bg-white p-4 rounded-4 shadow-sm border">
    <div class="col-md-8">
        <h2 class="fw-bold text-dark mb-2"><i class="fa-solid fa-notes-medical text-primary me-2"></i>Catálogo B2B</h2>
        <p class="text-muted mb-0">Seleccione los insumos médicos y gestione el abastecimiento para su institución.</p>
    </div>
    <div class="col-md-4 text-md-end mt-4 mt-md-0">
        <button class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm px-4" type="button" data-bs-toggle="offcanvas" data-bs-target="#carroLateral">
            <i class="fa-solid fa-cart-shopping me-2"></i> Mi Pedido 
            <span id="cartCount" class="badge bg-white text-primary ms-2 rounded-circle px-2 py-1">0</span>
        </button>
    </div>
</div>

<div class="row">
    <!-- Sidebar de Filtros -->
    <div class="col-lg-3 mb-4">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-filter text-primary me-2"></i>Filtros</h5>
                <hr>
                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary small text-uppercase mb-2">Categoría</label>
                    <div id="categoriasList" class="d-flex flex-column gap-2">
                        <!-- Las categorías se cargarán aquí -->
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    </div>
                </div>
                <div>
                    <button onclick="cargarCatalogo('')" class="btn btn-outline-secondary w-100 rounded-pill fw-bold">
                        Limpiar Filtros
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Grid de Productos -->
    <div class="col-lg-9">
        <div class="row g-4" id="catalogoContainer">
            <!-- Cargando... -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
                <p class="mt-3 text-muted">Cargando inventario...</p>
            </div>
        </div>
    </div>
</div>

<!-- Menú Lateral: Carro de Compras B2B -->
<div class="offcanvas offcanvas-end shadow" tabindex="-1" id="carroLateral">
    <div class="offcanvas-header bg-light border-bottom">
        <h5 class="offcanvas-title fw-bold"><i class="fa-solid fa-box-open text-primary me-2"></i>Solicitud Activa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-0">
        <div id="carroItems" class="flex-grow-1 overflow-auto p-4">
            <!-- Items del carro inyectados con JS -->
        </div>
        <div class="mt-auto p-4 bg-light border-top">
            <button onclick="confirmarCheckout()" id="btnCheckout" class="btn btn-success w-100 py-3 fw-bold rounded-pill shadow-sm">
                <i class="fa-solid fa-check-double me-2"></i> Confirmar Transacción
            </button>
        </div>
    </div>
</div>

<script>
const token = localStorage.getItem('access_token');
if (!token) window.location.href = '/login/'; // Proteger vista

const headers = {
    'Authorization': `Bearer ${token}`,
    'Content-Type': 'application/json'
};

let catalogoVirtual = [];

// 1. Cargar Categorías (GET /api/categorias/)
async function cargarCategorias() {
    try {
        const res = await fetch('/api/categorias/', { headers });
        const categorias = await res.json();
        
        let html = `
            <div class="form-check custom-radio">
                <input class="form-check-input" type="radio" name="categoria" id="cat_todas" value="" checked onchange="cargarCatalogo('')">
                <label class="form-check-label" for="cat_todas">Todas las categorías</label>
            </div>`;
            
        categorias.forEach(cat => {
            html += `
            <div class="form-check custom-radio mt-2">
                <input class="form-check-input" type="radio" name="categoria" id="cat_${cat.id}" value="${cat.id}" onchange="cargarCatalogo(${cat.id})">
                <label class="form-check-label" for="cat_${cat.id}">${cat.nombre}</label>
            </div>`;
        });
        document.getElementById('categoriasList').innerHTML = html;
    } catch(e) {
        console.error("Error cargando categorías", e);
    }
}

// 2. Cargar el Catálogo (GET /api/insumos/)
async function cargarCatalogo(categoriaId = '') {
    const container = document.getElementById('catalogoContainer');
    container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';
    
    let url = '/api/insumos/';
    if (categoriaId) {
        url += `?categoria=${categoriaId}`;
    }

    try {
        const res = await fetch(url, { headers });
        catalogoVirtual = await res.json();
        
        container.innerHTML = '';
        
        if (catalogoVirtual.length === 0) {
            container.innerHTML = '<div class="col-12 text-center text-muted py-5">No hay productos en esta categoría.</div>';
            return;
        }

        catalogoVirtual.forEach(insumo => {
            const precioCLP = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(insumo.precio_unitario);
            
            container.innerHTML += `
                <div class="col-md-6 col-xl-4">
                    <div class="card h-100 bg-white overflow-hidden shadow-sm hover-elevate">
                        <div class="p-3 bg-white text-center border-bottom" style="height: 220px; display: flex; align-items: center; justify-content: center;">
                            <img src="${insumo.imagen_url}" class="img-fluid" alt="${insumo.nombre_comercial}" style="max-height: 100%; object-fit: contain;">
                        </div>
                        <div class="card-body d-flex flex-column">
                            <span class="badge bg-light text-secondary border mb-2 align-self-start">Lote: ${insumo.lote}</span>
                            <h6 class="fw-bold text-dark mb-1" style="font-size: 1.1rem;">${insumo.nombre_comercial}</h6>
                            <p class="text-muted small mb-3"><i class="fa-solid fa-flask me-1 text-primary"></i>${insumo.principio_activo}</p>
                            <div class="d-flex justify-content-between align-items-center mt-auto">
                                <h4 class="text-success fw-bold mb-0">${precioCLP}</h4>
                                <span class="badge ${insumo.stock > 10 ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'} px-2 py-1 border">
                                    <i class="fa-solid fa-cubes me-1"></i>Stock: ${insumo.stock}
                                </span>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-0 p-3 pt-0">
                            <div class="input-group mb-2">
                                <span class="input-group-text bg-light text-secondary border-end-0">Cant.</span>
                                <input type="number" id="cant_${insumo.id}" class="form-control text-center border-start-0 ps-0" value="1" min="1" max="${insumo.stock}">
                            </div>
                            <button onclick="agregarAlCarro(${insumo.id})" class="btn btn-primary w-100 rounded-pill fw-bold shadow-sm" ${insumo.stock === 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-cart-plus me-1"></i> Agregar al Pedido
                            </button>
                        </div>
                    </div>
                </div>`;
        });
    } catch(e) {
        console.error("Error cargando catálogo", e);
    }
}

// 3. Cargar Carrito (GET /api/carro-insumos/)
async function cargarCarro() {
    const res = await fetch('/api/carro-insumos/', { headers });
    const items = await res.json();
    
    const container = document.getElementById('carroItems');
    document.getElementById('cartCount').innerText = items.length;
    container.innerHTML = '';
    
    if (items.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted mt-5">
                <i class="fa-solid fa-cart-arrow-down fa-3x mb-3 text-light"></i>
                <p>Tu carro de abastecimiento está vacío.</p>
            </div>`;
        document.getElementById('btnCheckout').disabled = true;
        return;
    }
    
    document.getElementById('btnCheckout').disabled = false;
    
    items.forEach(item => {
        // Obtenemos info básica para mostrar (en prod real vendría del backend el nombre)
        let nombre = 'Insumo #' + item.insumo;
        const producto = catalogoVirtual.find(i => i.id === item.insumo);
        if (producto) nombre = producto.nombre_comercial;

        container.innerHTML += `
            <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white border shadow-sm rounded-3">
                <div>
                    <h6 class="fw-bold mb-1 text-dark">${nombre}</h6>
                    <span class="badge bg-primary rounded-pill">Cant: ${item.cantidad}</span>
                </div>
                <button onclick="eliminarDelCarro(${item.id})" class="btn btn-sm btn-outline-danger rounded-circle" title="Eliminar">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>`;
    });
}

// 4. Agregar Item
async function agregarAlCarro(idInsumo) {
    const inputE = document.getElementById('cant_' + idInsumo);
    const cantidad = inputE ? parseInt(inputE.value) : 1;
    
    if (isNaN(cantidad) || cantidad < 1) {
        alert("Por favor ingrese una cantidad válida mayor a 0.");
        return;
    }

    await fetch('/api/carro-insumos/agregar_insumo/', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ insumo: idInsumo, cantidad: cantidad })
    });
    
    if(inputE) inputE.value = 1; // Resetea el input a 1
    cargarCarro(); // Refrescar
}

// 5. Eliminar Item
async function eliminarDelCarro(idItem) {
    await fetch(`/api/carro-insumos/${idItem}/eliminar_insumo/`, {
        method: 'DELETE',
        headers: headers
    });
    cargarCarro();
}

// 6. Confirmar Transacción
async function confirmarCheckout() {
    const btn = document.getElementById('btnCheckout');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Procesando...';
    btn.disabled = true;

    const res = await fetch('/api/solicitudes/confirmar_solicitud/', {
        method: 'POST',
        headers: headers
    });

    if (res.ok) {
        alert("¡Transacción Exitosa! Se ha emitido la orden y el stock ha sido descontado atómicamente.");
        // Refrescar
        cargarCatalogo();
        cargarCarro();
        const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('carroLateral'));
        offcanvas.hide();
    } else {
        const error = await res.json();
        alert("Error en la transacción: " + (error.error || "Falla desconocida. Posible stock insuficiente."));
    }
    btn.innerHTML = '<i class="fa-solid fa-check-double me-2"></i> Confirmar Transacción';
    btn.disabled = false;
}

// Iniciar aplicación
cargarCategorias();
cargarCatalogo().then(() => cargarCarro());
</script>

<style>
/* Estilos extra para embellecer */
.hover-elevate { transition: transform 0.2s ease, box-shadow 0.2s ease; }
.hover-elevate:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important; }
.custom-radio .form-check-input:checked { background-color: #0d6efd; border-color: #0d6efd; }
.custom-radio label { cursor: pointer; color: #495057; }
.custom-radio .form-check-input:checked ~ label { font-weight: bold; color: #0d6efd; }
</style>
{% endblock %}
