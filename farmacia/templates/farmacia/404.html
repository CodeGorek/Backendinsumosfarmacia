<!--
    Plantilla de control de errores de navegación (Página No Encontrada).
    Se renderiza automáticamente mediante el interceptor Catch-All en caso de URLs inválidas.
-->
{% extends 'farmacia/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center text-center" style="min-height: 50vh;">
    <div class="col-md-6">
        <div class="display-1 text-danger mb-3">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 class="display-4 fw-bold">Error 404</h1>
        <h3 class="text-muted mb-4">Página no encontrada</h3>
        <p class="mb-4">Lo sentimos, la ruta que intentas buscar no existe o ha sido movida dentro del sistema B2B.</p>
        <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 py-2 fw-bold">
            <i class="fa-solid fa-house me-2"></i> Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
