<!-- 
    Plantilla base estructural (Layout).
    Define el esquema global HTML5, carga los recursos estáticos (CSS/JS) 
    y configura la lógica universal de autenticación en la barra de navegación. 
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insumos Médicos B2B</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #f0f4f8; 
            font-family: 'Inter', sans-serif;
            color: #334155;
        }
        main { flex: 1; }
        .navbar-custom { background-color: #0f172a; }
        .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
        .card { border-radius: 12px; border: 1px solid #e2e8f0; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .btn-primary { background-color: #2563eb; border-color: #2563eb; font-weight: 500; }
        .btn-primary:hover { background-color: #1d4ed8; border-color: #1d4ed8; }
        
        /* Opción Nuclear Global: Cursor SVG negro para todos los formularios del sistema */
        .form-control, .form-select {
            background-color: #ffffff !important;
            color: #000000 !important;
            caret-color: #0d6efd !important;
            cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMCIgaGVpZ2h0PSIyMCI+PHBhdGggZD0iTTEsMSBMOSwxIE01LDEgTDUsMTkgTTEsMTkgTDksMTkiIHN0cm9rZT0iYmxhY2siIHN0cm9rZS13aWR0aD0iMiIvPjwvc3ZnPg==') 5 10, text !important;
        }
        .form-control:focus, .form-select:focus {
            background-color: #ffffff !important;
            color: #000000 !important;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25) !important;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <i class="fa-solid fa-staff-snake me-2"></i>MediSupply B2B
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="navMenuDinamico">
                    <!-- Inyectado por JS -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico -->
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de Página (Footer) Obligatorio -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">
                <i class="fa-solid fa-code me-1"></i> Desarrollado por: <strong>Oscar Javier Pérez Salazar</strong> | 
                Sección: <strong>IEC-N4-C1</strong> | Año: <strong>2026</strong>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script Global de Autenticación Navbar -->
    <script>
        function parseJwt(token) {
            try {
                var base64Url = token.split('.')[1];
                var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch(e) {
                return null;
            }
        }

        const menu = document.getElementById('navMenuDinamico');
        const tokenGlobal = localStorage.getItem('access_token');
        
        if (tokenGlobal) {
            const decoded = parseJwt(tokenGlobal);
            const username = decoded ? decoded.username : 'Usuario';
            
            let adminBtn = '';
            if (decoded && decoded.is_superuser) {
                adminBtn = `
                <li class="nav-item me-3">
                    <a href="/admin/" target="_blank" class="btn btn-warning btn-sm rounded-pill fw-bold text-dark shadow-sm">
                        <i class="fa-solid fa-screwdriver-wrench me-1"></i> Panel Admin
                    </a>
                </li>`;
            }

            menu.innerHTML = adminBtn + `
                <li class="nav-item me-3 text-white">
                    <i class="fa-solid fa-user-circle me-1"></i> Hola, <strong>${username}</strong>
                </li>
                <li class="nav-item">
                    <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm rounded-pill fw-bold bg-white">
                        <i class="fa-solid fa-power-off me-1"></i> Cerrar Sesión
                    </button>
                </li>
            `;
        } else {
            menu.innerHTML = `
                <li class="nav-item">
                    <a href="/login/" class="nav-link text-white fw-bold"><i class="fa-solid fa-right-to-bracket me-1"></i> Iniciar Sesión</a>
                </li>
            `;
        }

        function cerrarSesion() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/login/';
        }
    </script>
</body>
</html>
